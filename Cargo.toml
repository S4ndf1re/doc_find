[package]
name = "doc_search"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.75"
async-trait = "0.1.73"
ndarray = "0.15.6"
ort = { version = "1.15.2", features = ["cuda"] }
qdrant-client = "1.4.0"
serde = { version = "1.0.174", features = ["serde_derive", "derive", "rc"] }
serde_json = "1.0.105"
tikv-client = "0.2.0"
tokenizers = "0.13.4"
tokio = { version = "1.32.0", features = ["rt", "rt-multi-thread"] }
uuid = { version = "1.4.1", features = ["v4"] }
